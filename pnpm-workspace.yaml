allowBuilds:
  # these only build or download their native binary when the prebuilt one from
  # their platform-specific optional dependency (@parcel/watcher-*, @esbuild/*,
  # @unrs/resolver-binding-*) is missing
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false

overrides:
  # d3-svg-legend pins d3-scale/d3-transition 1.x, which pull in d3-color <3.1.0
  # (GHSA-36jr-mh4h-2g58, ReDoS)
  d3-color@<3.1.0: ^3.1.0
