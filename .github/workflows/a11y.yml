name: Accessibility

# Prerenders the site and scans every page with axe-core in Playwright (tests/a11y.spec.ts).
# There is no matching Husky hook: building the site and driving a browser is too slow for one.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run accessibility tests
        run: pnpm test:a11y
      - name: Upload report
        # the report has each page's full axe results and a trace of every failed test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
