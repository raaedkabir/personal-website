name: Test

# Runs the Playwright suite in tests/ (functional, screenshot and axe accessibility tests) on pull requests.
# Screenshots of the PR are compared with screenshots of its base branch, taken in the same job; differences are
# listed in the job summary but don't fail it. There is no matching Husky hook: building the site and driving a
# browser is too slow for one.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the merge commit GitHub tests and its first parent, the base branch the screenshots are compared with
          fetch-depth: 2
      - name: Set node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Type-check tests
        run: pnpm test:e2e:typecheck
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          E2E_BASE: HEAD^1
      - name: Upload report
        id: report
        # the report has the base, new and diff images of every changed screenshot, each page's full axe results
        # and a trace of every failed test that was retried
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Link the report from the summary
        if: ${{ !cancelled() && steps.report.outputs.artifact-url }}
        run: echo "[Download the Playwright report]($REPORT_URL) and open it with \`pnpm exec playwright show-report <unzipped folder>\`." >> "$GITHUB_STEP_SUMMARY"
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
