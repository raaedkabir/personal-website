name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-website:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm run generate
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: .output/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-website:
    needs: build-website
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Deploy to S3
        run: aws s3 sync ./dist s3://${{ secrets.BUCKET_ID }} --delete
      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"

  deploy-functions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        function:
          - contact-lambda
          - stripe-lambda
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Install Serverless Framework
        run: pnpm add --global serverless@4
      - name: Install modules
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
      - name: Create config
        if: matrix.function == 'stripe-lambda'
        # config.js is git-ignored; it reads the key from the deploy step's environment
        run: |
          echo 'module.exports = { STRIPE_SECRET_KEY: process.env.STRIPE_SECRET_KEY };' > config.js
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          mask-aws-account-id: true
      - name: Deploy to Lambda
        run: serverless deploy --verbose
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
